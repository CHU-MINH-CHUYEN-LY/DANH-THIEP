    <script>
        // --- 1. TOAST NOTIFICATION ---
        function showToast(message, isWarning = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = message;
            if (isWarning) {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-amber-500 text-sm";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-amber-400 text-sm";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 3000);
        }

        // --- 2. XỬ LÝ BANK MODAL & COPY STK ---
        function toggleBankModal() {
            const modal = document.getElementById('bank-modal');
            const content = document.getElementById('bank-modal-content');

            if (modal.classList.contains('opacity-0')) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                content.classList.remove('scale-90');
                content.classList.add('scale-100');
            } else {
                modal.classList.add('opacity-0', 'pointer-events-none');
                content.classList.remove('scale-100');
                content.classList.add('scale-90');
            }
        }

        function copyBankInfo() {
            const stk = "8888818756723";
            
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = stk;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            showToast("Đã sao chép STK Agribank: 8888818756723");
        }
